# Build container/Dockerfile at this commit and publish ghcr.io/<owner>/exl3-rdna4 with BuildKit provenance and a
# GitHub build attestation (gh attestation verify oci://ghcr.io/<owner>/exl3-rdna4@sha256:<digest> --owner <owner>).
name: container
on:
  workflow_dispatch:
    inputs:
      tag:
        description: tag to publish alongside the digest
        default: latest
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile
          build-args: |
            RECIPE_URL=https://github.com/${{ github.repository }}
            RECIPE_COMMIT=${{ github.sha }}
            MAX_JOBS=2
          push: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/exl3-rdna4:${{ inputs.tag }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/exl3-rdna4
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        if: always()
        run: |
          df -h /
          echo "ghcr.io/${{ github.repository_owner }}/exl3-rdna4@${{ steps.build.outputs.digest }} (recipe ${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
