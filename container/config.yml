# TabbyAPI config for the container image (container/Dockerfile): the same settings as serve/config.example.yml, with
# the models in /models and the server listening on all interfaces inside the container without an API key. Publish the
# port on 127.0.0.1 only (container/README.md) or put a gateway with a key in front. Mount your own file over
# /opt/recipe/tabbyAPI/config.yml, or pass --config, to change it.
network:
  host: 0.0.0.0
  port: 8096
  disable_auth: true
  # No browser origins: with auth off, the default ["*"] lets any web page open on this machine use the API.
  # Add your own frontend here if it calls the API from the browser (e.g. ["http://localhost:3000"]).
  allowed_origins: []
  # Don't fetch image URLs on a request's behalf; send images inline (base64).
  disable_fetch_requests: true
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false

model:
  model_dir: /models
  model_name: Qwen3.8-27B-EXL3-SC3.0bpw-H4
  backend: exllamav3
  # One 256-token page under cache_size: ExLlamaV3 counts the cache in pages and refuses a request that fills the
  # whole window when the two are equal.
  max_seq_len: 130816
  cache_size: 131072
  cache_mode: Q4
  gpu_split_auto: true
  autosplit_reserve: [768]
  chunk_size: 1024
  # How many requests decode together; more wait their turn. All active requests share the cache_size tokens above.
  # 3 is the default (about 195-200 tok/s combined for code through the API, vs 131-132 for one request). 4 is the
  # most we tested (~240-245 combined). It passed our long-context test after concurrent and image requests with
  # PyTorch's expandable segments on; setup/env.sh now turns them off (they corrupt memory on gfx1201), and 4 hasn't
  # been retested without them. Use 3.
  max_batch_size: 3
  # The vision encoder stays in system RAM (~20 ms per image). Keeping it in VRAM doesn't fit at 128k.
  vision: true
  vision_offload: true
  reasoning: true
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
  tool_format: qwen3_coder

draft_model:
  draft_mode: model
  draft_model_dir: /models
  # 3.0 bpw requant of incoai/Qwen3.8-27B-DFlash2 (setup/requant_draft.sh). Same speed as the 5.0 bpw quant, 0.89 vs 1.4 GB.
  # With Mia-AiLab's 5.0 bpw draft instead, use Qwen3.8-27B-DFlash2-EXL3-5.0bpw and lower max_seq_len/cache_size.
  draft_model_name: Qwen3.8-27B-DFlash2-EXL3-3.0bpw
  draft_cache_mode: Q4
  draft_num_tokens: 7

memory:
  sysmem_recurrent_cache: 4096
